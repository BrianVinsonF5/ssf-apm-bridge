apiVersion: v1
kind: Secret
metadata:
  name: ssf-bridge-secrets
  namespace: ssf-bridge
  labels:
    app.kubernetes.io/name: ssf-apm-bridge
    app.kubernetes.io/component: secrets
type: Opaque
# WARNING: this is a TEMPLATE. The bridge refuses to start while
# ADMIN_API_KEY is the placeholder below, shorter than 32 characters, or
# non-ASCII, so replace it before applying. Generate a value with:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
# deploy.sh / deploy.ps1 populate this from your .env automatically.
stringData:
  ADMIN_API_KEY: "change-me-to-a-long-random-value"
  BIGIP_USERNAME: "ssf-bridge-svc"
  BIGIP_PASSWORD: "change-me"
