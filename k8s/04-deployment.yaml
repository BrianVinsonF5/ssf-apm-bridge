apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssf-apm-bridge
  namespace: ssf-bridge
  labels:
    app.kubernetes.io/name: ssf-apm-bridge
    app.kubernetes.io/component: bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ssf-apm-bridge
  template:
    metadata:
      labels:
        app: ssf-apm-bridge
    spec:
      containers:
        - name: bridge
          image: ghcr.io/brianvinsonf5/ssf-apm-bridge:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              name: https
          envFrom:
            - configMapRef:
                name: ssf-bridge-config
            - secretRef:
                name: ssf-bridge-secrets
          # scheme: HTTPS is mandatory now that uvicorn holds the keypair --
          # the kubelet would otherwise send a plaintext GET to a TLS
          # listener, fail every probe, and crash-loop the pod. The kubelet
          # does not verify the certificate for probes, so the internal CA
          # does not need to be in its trust store.
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: ca-bundle-volume
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
            # The cert-manager-issued server keypair uvicorn terminates TLS
            # with. Mounted as a directory (not subPath) on purpose: subPath
            # mounts are NOT refreshed by the kubelet, so a renewed cert
            # would never reach the container.
            - name: tls-volume
              mountPath: /etc/ssf-bridge/tls
              readOnly: true
      volumes:
        - name: ca-bundle-volume
          configMap:
            name: internal-ca-bundle
            # optional so the Deployment still rolls out in clusters that
            # haven't applied 08-internal-ca-configmap.yaml; app/config.py
            # ignores a missing/empty/non-PEM bundle rather than failing.
            optional: true
        - name: tls-volume
          secret:
            # Written by the Certificate in 07-cert-manager.yaml. Keys are
            # tls.crt / tls.key (cert-manager's fixed naming).
            secretName: ssf-bridge-tls
            # NOT optional, unlike the CA bundle: the container is
            # configured to serve https and deliberately refuses to start
            # without the keypair rather than downgrading to cleartext, so
            # a missing secret should block scheduling with a clear
            # "secret not found" event instead of a crash loop.
            optional: false
            defaultMode: 0400

