apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: ssf-bridge
  labels:
    app.kubernetes.io/name: ssf-apm-bridge
    app.kubernetes.io/component: image-pull-secret
type: kubernetes.io/dockerconfigjson
# Replace .dockerconfigjson value below or generate using:
# kubectl create secret docker-registry ghcr-secret \
#   --docker-server=ghcr.io \
#   --docker-username=<GITHUB_USERNAME> \
#   --docker-password=<GITHUB_PAT_TOKEN> \
#   --namespace=ssf-bridge --dry-run=client -o yaml
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"CHANGE_ME_BASE64_USER_PASS"}}}'
