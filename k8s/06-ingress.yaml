apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ssf-apm-bridge-ingress
  namespace: ssf-bridge
  labels:
    app.kubernetes.io/name: ssf-apm-bridge
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # NOTE: deliberately NO cert-manager.io/cluster-issuer annotation here.
    #
    # That annotation makes ingress-shim auto-create its own Certificate for
    # this Ingress's tls.secretName -- and cert-manager requires each Ingress
    # to own a UNIQUE secret. Since 07-cert-manager.yaml already declares
    # ssf-bridge-certificate for ssf-bridge-tls (the pod mounts that same
    # secret to terminate TLS on the NodePort), annotating here produces a
    # second Certificate managing the same secret. The two controllers then
    # take turns re-issuing and overwriting each other's leaf, which shows up
    # as certificates rotating for no reason and pods serving a key that no
    # longer matches the cert.
    #
    # This is cert-manager's documented manual path: create the Certificate
    # directly and reference the resulting Secret from the Ingress (below).
    # The backend now speaks TLS (the pod terminates it for the NodePort
    # path), so the controller must connect with https. Without this it
    # would send cleartext to a TLS listener and return 502 for everything.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # The backend cert is issued for the service/node names in
    # 07-cert-manager.yaml, not for the upstream IP nginx dials, so pin the
    # name to verify against rather than disabling verification.
    nginx.ingress.kubernetes.io/proxy-ssl-name: "ssf-apm-bridge-service.ssf-bridge.svc.cluster.local"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    # Requires a secret holding the internal CA (ca.crt). cert-manager
    # places ca.crt in ssf-bridge-tls when the issuer is a CA issuer.
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "ssf-bridge/ssf-bridge-tls"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ssf-bridge.f5demos.com
      # Same secret the Certificate in 07-cert-manager.yaml populates, so
      # the Ingress reuses that leaf instead of requesting a second one.
      secretName: ssf-bridge-tls
  rules:
    - host: ssf-bridge.f5demos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssf-apm-bridge-service
                port:
                  # Matches the renamed https port in 05-service.yaml; the
                  # old `80` no longer exists on that Service.
                  number: 443
