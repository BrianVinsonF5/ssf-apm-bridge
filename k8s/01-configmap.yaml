apiVersion: v1
kind: ConfigMap
metadata:
  name: ssf-bridge-config
  namespace: ssf-bridge
  labels:
    app.kubernetes.io/name: ssf-apm-bridge
    app.kubernetes.io/component: config
data:
  HOST: "0.0.0.0"
  PORT: "8443"
  LOG_LEVEL: "INFO"
  STORE_BACKEND: "redis"
  REDIS_URL: "redis://redis-service.ssf-bridge.svc.cluster.local:6379/0"
  # --- Inbound TLS ---
  # The pod terminates TLS itself. This is not optional for the NodePort
  # path: a NodePort is L4 forwarding, so nothing between the caller and
  # the container can hold a certificate. Paths point at the cert-manager
  # secret 'ssf-bridge-tls' (07-cert-manager.yaml), mounted read-only by
  # 04-deployment.yaml. cert-manager's key names are fixed as tls.crt /
  # tls.key.
  #
  # Setting only one of the two is refused at start-up, and a missing or
  # empty file exits non-zero rather than falling back to plaintext -- a
  # silent downgrade would publish ADMIN_API_KEY in cleartext on the node
  # port. To deliberately serve http (only behind a TLS-terminating
  # Ingress), clear BOTH values and set PORT back to 8080.
  TLS_CERT_FILE: "/etc/ssf-bridge/tls/tls.crt"
  TLS_KEY_FILE: "/etc/ssf-bridge/tls/tls.key"
  RECEIVER_BASE_URL: "https://ssf-bridge.example.com"
  REPLAY_JTI_TTL_SECONDS: "900"
  DECISION_CACHE_TTL_SECONDS: "300"
  CORRELATION_TTL_SECONDS: "86400"
  SET_MAX_AGE_SECONDS: "900"
  SET_CLOCK_SKEW_SECONDS: "120"
  BIGIP_HOST: "bigip-apm.example.internal"
  BIGIP_PORT: "443"
  BIGIP_VERIFY_TLS: "true"
  BIGIP_AUTH_MODE: "token"
  BIGIP_ENABLE_FAST_PATH: "false"
  # Path the internal-ca-bundle ConfigMap is mounted at (see 04-deployment.yaml).
  # These MUST be set for the mounted bundle to actually be trusted -- with them
  # empty the volume is mounted and then ignored, and internal HTTPS (BIG-IP,
  # Keycloak SSF) falls back to the system trust store and fails.
  # app/config.py validates the file and ignores it if it is empty or not PEM,
  # so leaving 08-internal-ca-configmap.yaml unpopulated is safe.
  CA_BUNDLE_PATH: "/etc/ssl/certs/ca-bundle.crt"
  SSL_CERT_FILE: "/etc/ssl/certs/ca-bundle.crt"
  # Default TLS-verification policy for outbound calls to SSF transmitters
  # (discovery, stream management, JWKS, polling). Leave "true": a single
  # self-signed transmitter should be handled per-request with
  # "verify_tls": false in the /admin/transmitters/discover body rather than
  # by disabling verification for every transmitter here.
  SSF_VERIFY_TLS: "true"

